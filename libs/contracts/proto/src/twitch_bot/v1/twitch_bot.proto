syntax = "proto3";

package twitch_bot.v1;

service TwitchBotService {
  rpc StartAuthorization(StartAuthorizationRequest) returns (StartAuthorizationResponse);
  rpc CompleteAuthorization(CompleteAuthorizationRequest) returns (CompleteAuthorizationResponse);
  rpc ListChannels(ListChannelsRequest) returns (ListChannelsResponse);
  rpc DisconnectChannel(DisconnectChannelRequest) returns (DisconnectChannelResponse);
  rpc SyncChatters(SyncChattersRequest) returns (SyncChattersResponse);
  rpc SyncClips(SyncClipsRequest) returns (SyncClipsResponse);
  rpc SyncFollowers(SyncFollowersRequest) returns (SyncFollowersResponse);
  rpc SyncMedia(SyncMediaRequest) returns (SyncMediaResponse);
  rpc ListFriends(ListFriendsRequest) returns (ListFriendsResponse);
  rpc AddFriend(AddFriendRequest) returns (AddFriendResponse);
  rpc RemoveFriend(RemoveFriendRequest) returns (RemoveFriendResponse);
  rpc SyncStreams(SyncStreamsRequest) returns (SyncStreamsResponse);
}

message Channel {
  string id = 1;
  string twitch_id = 2;
  string login = 3;
  string display_name = 4;
  repeated string scopes = 5;
  bool connected = 6;
  string created_at = 7;
  optional string updated_at = 8;
}

message StartAuthorizationRequest {
  string state = 1;
  string redirect_uri = 2;
}

message StartAuthorizationResponse {
  string url = 1;
}

message CompleteAuthorizationRequest {
  string code = 1;
  string redirect_uri = 2;
}

message CompleteAuthorizationResponse {
  Channel channel = 1;
}

message ListChannelsRequest {}

message ListChannelsResponse {
  repeated Channel channels = 1;
}

message DisconnectChannelRequest {
  string id = 1;
}

message DisconnectChannelResponse {
  Channel channel = 1;
}

message SyncChattersRequest {}

message SyncChattersResponse {
  int32 joined = 1;
  int32 left = 2;
}

message SyncClipsRequest {}

message SyncClipsResponse {
  int32 created = 1;
}

message SyncFollowersRequest {}

message SyncFollowersResponse {
  int32 followed = 1;
  int32 unfollowed = 2;
}


message SyncMediaRequest {}

message SyncMediaResponse {
  int32 imported_clips = 1;
  int32 imported_videos = 2;
  int32 created_clips = 3;
  int32 created_videos = 4;
}


message Friend {
  string id = 1;
  string twitch_id = 2;
  string login = 3;
  string display_name = 4;
  string created_at = 5;
  optional string updated_at = 6;
}

message ListFriendsRequest {}

message ListFriendsResponse {
  repeated Friend friends = 1;
}

message AddFriendRequest {
  string login = 1;
}

message AddFriendResponse {
  Friend friend = 1;
}

message RemoveFriendRequest {
  string id = 1;
}

message RemoveFriendResponse {
  Friend friend = 1;
}

message SyncStreamsRequest {}

message SyncStreamsResponse {
  int32 live = 1;
  int32 online = 2;
  int32 offline = 3;
}
syntax = "proto3";

package blog.v1;

service CategoryService {
  rpc CreateCategory(CreateCategoryRequest) returns (CreateCategoryResponse);
  rpc UpdateCategory(UpdateCategoryRequest) returns (UpdateCategoryResponse);
  rpc ChangeCategoryParent(ChangeCategoryParentRequest) returns (ChangeCategoryParentResponse);
  rpc DeleteCategory(DeleteCategoryRequest) returns (DeleteCategoryResponse);
  rpc RestoreCategory(RestoreCategoryRequest) returns (RestoreCategoryResponse);
  rpc GetCategory(GetCategoryRequest) returns (GetCategoryResponse);
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse);
}

message Category {
  string id = 1;
  string title = 2;
  string slug = 3;
  optional string description = 4;
  optional string parent_id = 5;
  string created_at = 6;
  optional string updated_at = 7;
  optional string deleted_at = 8;
}

message CreateCategoryRequest {
  string title = 1;
  optional string description = 2;
  optional string parent_id = 3;
}

message CreateCategoryResponse {
  Category category = 1;
}

message UpdateCategoryRequest {
  string id = 1;
  string title = 2;
  optional string description = 3;
}

message UpdateCategoryResponse {
  Category category = 1;
}

message ChangeCategoryParentRequest {
  string id = 1;
  optional string parent_id = 2;
}

message ChangeCategoryParentResponse {
  Category category = 1;
}

message DeleteCategoryRequest {
  string id = 1;
}

message DeleteCategoryResponse {
  Category category = 1;
}

message RestoreCategoryRequest {
  string id = 1;
}

message RestoreCategoryResponse {
  Category category = 1;
}

message GetCategoryRequest {
  string id = 1;
  bool with_deleted = 2;
}

message GetCategoryResponse {
  Category category = 1;
}

message ListCategoriesRequest {
  optional int32 limit = 1;
  optional int32 offset = 2;
  bool with_deleted = 3;
}

message ListCategoriesResponse {
  repeated Category categories = 1;
}
syntax = "proto3";

package blog.v1;

service PostService {
  rpc CreatePost(CreatePostRequest) returns (CreatePostResponse);
  rpc UpdatePost(UpdatePostRequest) returns (UpdatePostResponse);
  rpc PublishPost(PublishPostRequest) returns (PublishPostResponse);
  rpc ArchivePost(ArchivePostRequest) returns (ArchivePostResponse);
  rpc UnarchivePost(UnarchivePostRequest) returns (UnarchivePostResponse);
  rpc DeletePost(DeletePostRequest) returns (DeletePostResponse);
  rpc RestorePost(RestorePostRequest) returns (RestorePostResponse);
  rpc GetPost(GetPostRequest) returns (GetPostResponse);
  rpc GetPublishedPost(GetPublishedPostRequest) returns (GetPublishedPostResponse);
  rpc ListPosts(ListPostsRequest) returns (ListPostsResponse);
}

enum PostStatus {
  POST_STATUS_UNSPECIFIED = 0;
  POST_STATUS_DRAFT = 1;
  POST_STATUS_PUBLISHED = 2;
  POST_STATUS_ARCHIVED = 3;
}

message Post {
  string id = 1;
  string author_id = 2;
  string title = 3;
  string slug = 4;
  optional string excerpt = 5;
  string content = 6;
  PostStatus status = 7;
  bool featured = 8;
  int32 reading_time = 9;
  repeated string category_ids = 10;
  repeated string tag_ids = 11;
  optional string blog_image_id = 12;
  optional string hero_image_id = 13;
  optional string published_at = 14;
  string created_at = 15;
  optional string updated_at = 16;
  optional string deleted_at = 17;
}

message CreatePostRequest {
  reserved 1;
  reserved "author_id";

  string title = 2;
  optional string excerpt = 3;
  string content = 4;
  bool featured = 5;
  repeated string category_ids = 6;
  repeated string tag_ids = 7;
  optional string blog_image_id = 8;
  optional string hero_image_id = 9;
}

message CreatePostResponse {
  Post post = 1;
}

message UpdatePostRequest {
  string id = 1;
  string title = 2;
  optional string excerpt = 3;
  string content = 4;
  bool featured = 5;
  repeated string category_ids = 6;
  repeated string tag_ids = 7;
  optional string blog_image_id = 8;
  optional string hero_image_id = 9;
  repeated string update_mask = 10;
}

message UpdatePostResponse {
  Post post = 1;
}

message PublishPostRequest {
  string id = 1;
  optional string published_at = 2;
}

message PublishPostResponse {
  Post post = 1;
}

message ArchivePostRequest {
  string id = 1;
}

message ArchivePostResponse {
  Post post = 1;
}

message UnarchivePostRequest {
  string id = 1;
}

message UnarchivePostResponse {
  Post post = 1;
}

message DeletePostRequest {
  string id = 1;
}

message DeletePostResponse {
  Post post = 1;
}

message RestorePostRequest {
  string id = 1;
}

message RestorePostResponse {
  Post post = 1;
}

message GetPostRequest {
  string id = 1;
  bool with_deleted = 2;
}

message GetPostResponse {
  Post post = 1;
}

message GetPublishedPostRequest {
  string slug = 1;
}

message GetPublishedPostResponse {
  Post post = 1;
}

message ListPostsRequest {
  optional PostStatus status = 1;
  optional string category_id = 2;
  optional string tag_id = 3;
  optional int32 limit = 4;
  optional int32 offset = 5;
}

message ListPostsResponse {
  repeated Post posts = 1;
}